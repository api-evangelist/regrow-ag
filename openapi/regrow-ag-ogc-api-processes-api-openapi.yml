    FieldPractices:
      additionalProperties: false
      properties:
        errors:
          description: A list of errors raised while calculating field stats.
          items:
            $ref: '#/components/schemas/MonitorError'
          title: Errors
          type: array
        green_cover:
          description: An array of objects describing the level of green cover on a field during the requested time period. Each object represents a post-harvest green cover ‘observation window’. Green cover data is used to inform the likelihood and strength of a cover crop on a field.
          items:
            $ref: '#/components/schemas/GreenCover'
          title: Green Cover
          type: array
        main_crop_type:
          description: An array of objects describing the main crops on field during the requested time period.
          items:
            $ref: '#/components/schemas/MainCropTypes'
          title: Main Crop Type
          type: array
        tillage:
          description: An array of tillage practice determination objects and their associated tillage intensity, during the requested time period for a field. Each object represents a tillage determination window, which is derived from a tillage observation window. Tillage observation windows represent the time period by which plant residue is monitored on the field. The observation windows span a period of four months, either 3 months before the crop `plant date` and one month after, or 3 months after the crop `harvest date` and one month before.
          items:
            $ref: '#/components/schemas/Tillage'
          title: Tillage
          type: array
        living_root:
          items:
            $ref: '#/components/schemas/LivingRootIntermediate'
          title: Living Root
          type: array
        cultivation_cycles:
          items:
            $ref: '#/components/schemas/CultivationCycle'
          title: Cultivation Cycles
          type: array
      required:
      - errors
      - green_cover
      - main_crop_type
      - tillage
      - living_root
      - cultivation_cycles
      title: FieldPractices
      type: object
