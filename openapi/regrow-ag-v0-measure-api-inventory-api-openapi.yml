      description: "The applicationEvent contains data about a single fertilizer or nutrient management event on a field. The applied product type (ex: basic synthetic fertilizer, organic fertilizer) is specified for each event, along with the application date, method, amount and rate applied.\n\n    - Basic Inorganic: inorganic fertilizer products that are not enhanced-efficiency nitrogen fertilizers\n    - EENF Inorganic: enhanced efficiency nitrogen fertilizer products that are designed to reduce nitrogen losses to the environment and increase nitrogen availability to crops\n    - Organic: organic fertilizer products (manure, mulch, compost, etc.)\n\n    | nutrient_product_type | valid application_method choices |\n    | --------------------- | -------------------------------- |\n    | basic_inorganic       | broadcast, subsurface, fertigation_furrow, fertigation_sprinkler, fertigation_drip, fertigation_subsurface_drip |\n    | eenf_inorganic        | broadcast, subsurface, fertigation_furrow, fertigation_sprinkler, fertigation_drip, fertigation_subsurface_drip |\n    | organic               | broadcast, inject |\n\n    **Currently \"lime\", \"potassium_chloride\", \"granite_dust\", \"manure_horse_liquid\" and \"cottonseed_hull_ash\" events are accepted, but the values are not used by DNDC for outcomes calculations. This feature will be added in the future.**\n\n    "
