 ReductionEnum.HAY_50 | frac_stem_removed | 0.5 | \n| ReductionEnum.HAY_50 | frac_stem_residue | 0.0 | \n| ReductionEnum.HAY_50 | frac_root_removed | 0.0 | \n| ReductionEnum.HAY_50 | frac_root_residue | 0.0 | \n| ReductionEnum.MOW_75 | frac_grain_removed | 0.0 | \n| ReductionEnum.MOW_75 | frac_grain_residue | 1.0 | \n| ReductionEnum.MOW_75 | frac_leaf_removed | 0.0 | \n| ReductionEnum.MOW_75 | frac_leaf_residue | 0.75 | \n| ReductionEnum.MOW_75 | frac_stem_removed | 0.0 | \n| ReductionEnum.MOW_75 | frac_stem_residue | 0.75 | \n| ReductionEnum.MOW_75 | frac_root_removed | 0.0 | \n| ReductionEnum.MOW_75 | frac_root_residue | 0.0 | \n| ReductionEnum.HAY_75 | frac_grain_removed | 1.0 | \n| ReductionEnum.HAY_75 | frac_grain_residue | 0.0 | \n| ReductionEnum.HAY_75 | frac_leaf_removed | 0.75 | \n| ReductionEnum.HAY_75 | frac_leaf_residue | 0.0 | \n| ReductionEnum.HAY_75 | frac_stem_removed | 0.75 | \n| ReductionEnum.HAY_75 | frac_stem_residue | 0.0 | \n| ReductionEnum.HAY_75 | frac_root_removed | 0.0 | \n| ReductionEnum.HAY_75 | frac_root_residue | 0.0 | \n| ReductionEnum.MOW_100 | frac_grain_removed | 0.0 | \n| ReductionEnum.MOW_100 | frac_grain_residue | 1.0 | \n| ReductionEnum.MOW_100 | frac_leaf_removed | 0.0 | \n| ReductionEnum.MOW_100 | frac_leaf_residue | 1.0 | \n| ReductionEnum.MOW_100 | frac_stem_removed | 0.0 | \n| ReductionEnum.MOW_100 | frac_stem_residue | 1.0 | \n| ReductionEnum.MOW_100 | frac_root_removed | 0.0 | \n| ReductionEnum.MOW_100 | frac_root_residue | 0.0 | \n| ReductionEnum.HAY_100 | frac_grain_removed | 1.0 | \n| ReductionEnum.HAY_100 | frac_grain_residue | 0.0 | \n| ReductionEnum.HAY_100 | frac_leaf_removed | 1.0 | \n| ReductionEnum.HAY_100 | frac_leaf_residue | 0.0 | \n| ReductionEnum.HAY_100 | frac_stem_removed | 1.0 | \n| ReductionEnum.HAY_100 | frac_stem_residue | 0.0 | \n| ReductionEnum.HAY_100 | frac_root_removed | 0.0 | \n| ReductionEnum.HAY_100 | frac_root_residue | 0.0 | "
