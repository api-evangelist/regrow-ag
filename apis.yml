aid: regrow-ag

name: Regrow

description: Regrow (regrow.ag) runs an Agriculture Resilience Platform that helps food and agriculture companies measure, report, and reduce
  on-farm greenhouse gas emissions, cut scope 3 emissions and work toward net zero goals. Its developer portal at developers.regrow.ag lists the
  Explore API (baseline GHG emissions and the modeled impact of regenerative practices), the Measure API Enteric, Intervention and Inventory modules,
  and the Monitor API (remote-sensing based field crop and management practice verification). The API documentation requires signing in to the
  portal.

